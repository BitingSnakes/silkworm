# Shared settings for every spider service.
x-spider: &spider
  build:
    context: .
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  image: silkworm-rs:latest
  init: true
  stop_grace_period: 30s
  volumes:
    - ./data:/app/data
  environment:
    SILKWORM_LOG_LEVEL: ${SILKWORM_LOG_LEVEL:-INFO}

services:
  # Default spider service using quotes_spider
  quotes:
    <<: *spider
    command: ["python", "examples/quotes_spider.py"]

  # Production-style crawl: validated, resumable, fails loudly
  production:
    <<: *spider
    command: ["python", "examples/production_quotes_spider.py"]
    profiles: ["production"]

  # HackerNews spider with configurable pages
  hackernews:
    <<: *spider
    command: ["python", "examples/hackernews_spider.py", "--pages", "5"]
    profiles: ["hackernews"]

  # Lobsters spider with configurable pages
  lobsters:
    <<: *spider
    command: ["python", "examples/lobsters_spider.py", "--pages", "2"]
    profiles: ["lobsters"]

  # Custom spider - override command when running:
  #   docker compose run --rm custom python examples/your_spider.py
  custom:
    <<: *spider
    environment:
      SILKWORM_LOG_LEVEL: ${SILKWORM_LOG_LEVEL:-DEBUG}
    profiles: ["custom"]
