name: Tests

on:
  push:
    paths:
      - "src/silkworm/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/silkworm/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Init venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libev-dev

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Keep every extra in this single `uv sync`: a later sync would uninstall
          # extras it doesn't list. cassandra-driver's marker skips it on Python 3.14+.
          uv sync --group dev \
            --extra taskiq \
            --extra zenoh \
            --extra msgpack \
            --extra polars \
            --extra excel \
            --extra yaml \
            --extra avro \
            --extra elasticsearch \
            --extra mongodb \
            --extra s3 \
            --extra vortex \
            --extra mysql \
            --extra postgresql \
            --extra gsheets \
            --extra snowflake \
            --extra ftp \
            --extra sftp \
            --extra couchdb \
            --extra dynamodb \
            --extra duckdb \
            --extra cdp \
            --extra cassandra
          # Install msgpack for reading in tests (ormsgpack from --extra msgpack is for writing)
          uv pip install msgpack

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv sync --group dev \
            --extra taskiq \
            --extra zenoh \
            --extra msgpack \
            --extra polars \
            --extra excel \
            --extra yaml \
            --extra avro \
            --extra elasticsearch \
            --extra mongodb \
            --extra s3 \
            --extra mysql \
            --extra postgresql \
            --extra gsheets \
            --extra snowflake \
            --extra ftp \
            --extra sftp \
            --extra couchdb \
            --extra dynamodb \
            --extra duckdb \
            --extra cdp \
            --extra winloop
          # Install msgpack for reading in tests (ormsgpack from --extra msgpack is for writing)
          uv pip install msgpack

      - name: Verify public API type completeness
        # Fails if any exported symbol has a missing or partially unknown type.
        run: uv run --group dev pyright --verifytypes silkworm --ignoreexternal

      - name: Run tests
        run: uv run --group dev pytest -o "anyio_mode=auto"

  pypy-tests:
    name: Test (PyPy ${{ matrix.pypy-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["3.11", "3.12"]
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: pypy${{ matrix.pypy-version }}-v8.0.0

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --no-dev --frozen --python "$(command -v python)"
          uv pip install --python .venv/bin/python pytest==9.1.1 anyio==4.15.1
          if [ "${{ matrix.pypy-version }}" = "3.11" ]; then
            uv pip install --python .venv/bin/python pydantic==2.13.5
          fi

      - name: Build wheel under PyPy
        run: uv build --wheel --python "$(command -v python)"

      - name: Run tests
        run: .venv/bin/python -m pytest -o "anyio_mode=auto"
