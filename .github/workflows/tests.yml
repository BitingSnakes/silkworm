name: Tests

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    # winloop has no Python 3.15 wheels yet and is built from source on Windows.
    continue-on-error: ${{ matrix.os == 'windows-latest' && matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Init venv
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libev-dev

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Keep every extra in this single `uv sync`: a later sync would uninstall
          # extras it doesn't list. cassandra-driver's marker skips it on Python 3.14+.
          uv sync --group dev \
            --extra taskiq \
            --extra msgpack \
            --extra polars \
            --extra excel \
            --extra yaml \
            --extra avro \
            --extra elasticsearch \
            --extra mongodb \
            --extra s3 \
            --extra vortex \
            --extra mysql \
            --extra postgresql \
            --extra gsheets \
            --extra snowflake \
            --extra ftp \
            --extra sftp \
            --extra couchdb \
            --extra dynamodb \
            --extra duckdb \
            --extra cdp \
            --extra cassandra
          # Install msgpack for reading in tests (ormsgpack from --extra msgpack is for writing)
          uv pip install msgpack

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          uv sync --group dev \
            --extra taskiq \
            --extra msgpack \
            --extra polars \
            --extra excel \
            --extra yaml \
            --extra avro \
            --extra elasticsearch \
            --extra mongodb \
            --extra s3 \
            --extra mysql \
            --extra postgresql \
            --extra gsheets \
            --extra snowflake \
            --extra ftp \
            --extra sftp \
            --extra couchdb \
            --extra dynamodb \
            --extra duckdb \
            --extra cdp \
            --extra winloop
          # Install msgpack for reading in tests (ormsgpack from --extra msgpack is for writing)
          uv pip install msgpack

      - name: Verify public API type completeness
        # Fails if any exported symbol has a missing or partially unknown type.
        run: uv run --group dev pyright --verifytypes silkworm --ignoreexternal

      - name: Run tests
        run: uv run --group dev pytest -o "anyio_mode=auto"
