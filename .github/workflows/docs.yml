name: Docs

on:
  push:
    paths:
      - "docs/**"
      - "src/silkworm/**"
      - ".readthedocs.yaml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "docs/**"
      - "src/silkworm/**"
      - ".readthedocs.yaml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build docs
        run: uv run --frozen --no-dev --group docs sphinx-build -W --keep-going -b html docs docs/_build/html
